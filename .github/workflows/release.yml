name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version"
            exit 1
          fi

      - name: Build zip (manifest.json at the zip root)
        run: |
          cd extension
          zip -r -X "../blackboard-course-downloader-${GITHUB_REF_NAME}.zip" . -x "README.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "blackboard-course-downloader-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
